[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "private-tutorial-studio"
version = "0.1.0"
description = "Private, local-first narrated tutorial video framework"
requires-python = ">=3.10,<3.14"
dependencies = ["kokoro-onnx==0.6.1", "soundfile==0.13.1", "Pillow==12.1.0"]

[project.scripts]
tutorial-studio = "tutorial_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tutorial_studio = ["voices.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
